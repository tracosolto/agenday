<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenday · agendamentos de serviços</title>
<meta name="description" content="Agenday: o cliente marca o horário sozinho, com aviso pelo WhatsApp.">
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenday">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
/* Visual único e moderno: preto, branco e dourado; tipografia geométrica, cantos largos, barras com vidro fosco.
   Layout: app de coluna única pensado para o celular; abas em pílula e barra de ação fixa no rodapé;
   cartão só para o que é acionável (barbearia, serviço, agendamento). */
:root{
  color-scheme:dark;
  --bg:#0b0b0b; --surface:#151514; --sunken:#1e1e1c;
  --ink:#f5f5f5; --muted:#a3a19b; --line:#2a2925;
  --brand:#d4af37; --on-brand:#0b0b0b; --brand-soft:#2b250f;
  --accent:#d4af37; --brand-text:#d4af37;
  --go:#6fd3a0; --on-go:#06231a; --go-soft:#15301f;
  --warn:#e9c46a; --warn-soft:#33290f;
  --bad:#f08a80; --bad-soft:#3d1c19;
  --font-display:"Sora","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --glass:rgba(11,11,11,.82);
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --r-s:12px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2{font-family:var(--font-display);font-weight:700;line-height:1.15;text-wrap:balance}
h1{font-size:1.7rem;letter-spacing:-.03em}
h2{font-size:1.12rem;font-weight:600;letter-spacing:-.02em}
h3{font-size:1rem;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.875rem}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top-in{max-width:640px;margin-inline:auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.brandname{font-family:var(--font-display);font-weight:700;font-size:1.3rem;letter-spacing:-.04em;color:var(--ink);text-transform:lowercase;background:none;border:0;padding:0;cursor:pointer}
.tag{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.top .spacer{flex:1}
.brandname img{display:block;height:26px;width:auto}
.brandname.named{text-transform:none;font-size:1.15rem;letter-spacing:-.02em;color:var(--brand-text);max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pole{height:1px;background:var(--line)}

.wrap{max-width:640px;margin-inline:auto;padding-inline:16px;padding-block:22px 110px;display:flex;flex-direction:column;gap:26px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row > .grow{flex:1;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 18px;border-radius:99px;transition:transform .12s ease,border-color .12s ease,background .12s ease;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;color:var(--ink);text-align:center}
.btn:hover{border-color:var(--muted)}
.btn:active,.svc:active,.slot:active,.day:active,.cday:active,.star:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){.btn,.svc,.slot,.day,.cday,.star{transition:none}.btn:active,.svc:active,.slot:active,.day:active,.cday:active,.star:active{transform:none}}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.wa{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.quiet{background:transparent}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.6;cursor:progress}
.btn.sm{min-height:38px;padding:6px 14px;font-size:.875rem}
.linkbtn{align-self:flex-start;background:none;border:0;padding:0;color:var(--brand-text);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.shop{display:flex;flex-direction:column;gap:10px}
.shop .meta{color:var(--muted);font-size:.9rem}
.badge{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn);vertical-align:middle}
.badge.free{background:var(--brand-soft);color:var(--brand-text)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.note{background:var(--sunken);border-radius:var(--r-s);padding:12px 14px;font-size:.9rem;color:var(--muted)}

label.field{display:flex;flex-direction:column;gap:4px;font-size:.875rem;font-weight:600;min-width:0}
input[type=text],input[type=tel],input[type=url],input[type=number],input[type=time],input[type=date],input[type=email],input[type=password],select,textarea{
  width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--sunken);font-weight:400}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:92px;resize:vertical}
input:disabled{opacity:.45}
.err{color:var(--bad);background:var(--bad-soft);border-radius:var(--r-s);padding:8px 12px;font-size:.9rem;font-weight:600}
.hint{font-weight:400;color:var(--muted);font-size:.8rem}

.step-h{display:flex;align-items:center;gap:10px}
.step-h .n{flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums}
.svc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:transform .12s ease,border-color .12s ease,background .12s ease}
.svc .grow{flex:1;min-width:0}
.svc .price{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.svc[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.day{flex:0 0 60px;display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 0;border:1px solid var(--line);border-radius:var(--r);transition:transform .12s ease;background:var(--surface);cursor:pointer}
.day .wd{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day .dn{font-family:var(--font-display);font-size:1.25rem;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.day .mo{font-size:.7rem;color:var(--muted)}
.day[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.day[aria-pressed=true] .wd,.day[aria-pressed=true] .mo{color:var(--on-brand)}
.day:disabled{opacity:.4;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.slot{min-height:48px;border:1px solid var(--line);border-radius:14px;transition:transform .12s ease;background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.slot[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

.receipt{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.receipt .head{background:var(--brand-soft);color:var(--brand-text);font-weight:700;padding:10px 14px}
.receipt dl{margin:0;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.receipt dt{color:var(--muted);font-size:.875rem}
.receipt dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.msg{white-space:pre-wrap;background:var(--sunken);border-radius:var(--r-s);padding:10px 12px;font-size:.9rem;user-select:all;overflow-wrap:anywhere}

.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.daynav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.daynav .btn{padding:0}
.bk{display:grid;grid-template-columns:auto auto 1fr auto;gap:4px 12px;align-items:start}
.bk-time{font-family:var(--font-display);font-weight:700;font-size:1.2rem;line-height:1.2;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bk-time span{display:block;font-family:var(--font-body);font-weight:500;font-size:.8rem;color:var(--muted)}
.bk-main{min-width:0;display:flex;flex-direction:column}
.bk-main span{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.bk-main .place{color:var(--brand-text)}
.bk-actions{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pill{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.agendado{background:var(--brand-soft);color:var(--brand-text)}
.pill.concluido{background:var(--go-soft);color:var(--go)}
.pill.cancelado{background:var(--bad-soft);color:var(--bad)}
.bk.is-cancelado .bk-time,.bk.is-cancelado .bk-main strong{text-decoration:line-through;color:var(--muted)}

.svc-edit{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.svc-edit .full{grid-column:1 / -1}
.hrow{display:grid;grid-template-columns:minmax(96px,1.1fr) 1fr 1fr;gap:8px;align-items:center}
.check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.95rem}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.savebar-in .grow .muted{font-weight:400}
section[id^="st-"]{scroll-margin-top:76px}
.cal-head{display:flex;align-items:center;gap:8px}
.cal-head h2{flex:1;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wdh{text-align:center;font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-block:4px}
.cday{aspect-ratio:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid transparent;border-radius:var(--r-s);transition:transform .12s ease;background:var(--surface);cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.cday .ct{font-size:.68rem;font-weight:700;color:var(--brand-text);line-height:1;min-height:.68rem}
.cday.closed{background:transparent;color:var(--muted)}
.cday.today{border-color:var(--muted)}
.cday[aria-pressed=true]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.cday[aria-pressed=true] .ct{color:var(--on-brand)}
.stars{display:flex;gap:6px}
.star{width:52px;height:52px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:1.7rem;line-height:1;color:var(--muted);cursor:pointer}
.star[aria-pressed=true]{color:var(--brand-text);border-color:var(--brand);background:var(--brand-soft)}
.rate{color:var(--brand-text);letter-spacing:.06em}
.rate.big{font-size:1.8rem}
.bk-main .rate{color:var(--brand-text)}
.bk-main .linkbtn{font-size:1rem;text-align:left}
.bk.is-cancelado .bk-main .linkbtn{text-decoration:line-through;color:var(--muted)}
.facts{margin:0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.savebar-in{max-width:640px;margin-inline:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.savebar-in .grow{flex:1;min-width:120px;font-weight:600}
.btn.outline{background:transparent;border-color:var(--brand);color:var(--brand-text)}
.bare .top{display:none}
.bare .wrap{min-height:100vh;min-height:100dvh;padding-block:32px;justify-content:center}
.welcome{max-width:380px;width:100%;margin-inline:auto;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.welcome .mark{width:76px;height:76px;color:var(--brand)}
.welcome .mark svg,.okmark svg{width:100%;height:100%;display:block}
.welcome .wordmark{width:min(240px,70vw);height:auto;display:block}
.tagline{font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);padding-left:.34em}
.welcome .cta{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:clamp(40px,14vh,120px)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:640px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;padding:4px 2px;font-size:.7rem;font-weight:600;color:var(--muted);cursor:pointer;border-radius:var(--r-s)}
.nav button[aria-selected=true]{color:var(--brand-text)}
.nav svg,.info svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.has-nav .wrap{padding-bottom:170px}
.has-nav .savebar{bottom:calc(63px + env(safe-area-inset-bottom,0px));border-bottom:1px solid var(--line)}
.has-nav .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
.av{width:38px;height:38px;border-radius:50%;background:var(--sunken);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.78rem;letter-spacing:.02em;color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:10px}
.hero .logo{width:112px;height:112px;object-fit:contain;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.info{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.info li{display:flex;gap:10px;align-items:flex-start}
.info svg{color:var(--brand-text);width:20px;height:20px;margin-top:2px}
.okmark{width:68px;height:68px;color:var(--brand);margin-inline:auto}
.center{text-align:center}
.logo-edit{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo-edit img,.logo-edit .ph{width:84px;height:84px;border-radius:18px;border:1px solid var(--line);background:var(--sunken);object-fit:contain}
.logo-edit .ph{display:grid;place-items:center;color:var(--muted);font-size:.75rem;text-align:center}
.svc .go{color:var(--brand-text);font-size:1.2rem;line-height:1}
.auth{max-width:420px;width:100%;margin-inline:auto;padding-top:18px}
.auth form{display:flex;flex-direction:column;gap:12px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.google{background:#fff;border-color:#dadce0;color:#1f1f1f}
.btn.google svg{width:18px;height:18px;flex:none}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center}
.links .linkbtn{align-self:auto}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.approved{background:var(--go-soft);color:var(--go)}
.pill.blocked{background:var(--bad-soft);color:var(--bad)}
.acct{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.acct .who{min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.acct .bk-actions{margin-top:6px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer;background:var(--sw)}
.swatch[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:2px}
input[type=color]{width:56px;height:44px;padding:2px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--sunken);cursor:pointer}
.foot{text-align:center;color:var(--muted);font-size:.85rem;display:flex;flex-direction:column;gap:6px;align-items:center}
.foot .linkbtn{align-self:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:22px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="brandname" data-act="brand" id="brand-home" aria-label="Agenday, página inicial"><img src="logo.png" alt="Agenday" width="113" height="26"></button>
    <span class="spacer"></span>
    <button class="btn sm" id="acct-btn" data-act="home" hidden>Minha conta</button>
    <button class="btn sm" id="install-btn" data-act="install" hidden>Instalar app</button>
  </div>
  <div class="pole" aria-hidden="true"></div>
</header>
<main id="app" class="wrap"></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';
var $app=document.getElementById('app'), $toast=document.getElementById('toast'), $brand=document.getElementById('brand-home'), $acct=document.getElementById('acct-btn');
var LS='cadeira-livre.v1', ME='encaixe.me', LAST='encaixe.last';
var PLAN=25;
/* Servidor (Supabase): login dos profissionais e dados de cada negócio.
   A chave abaixo é a chave pública do projeto; quem protege os dados são as regras do banco (schema.sql).
   Com url e key vazios o app roda em modo demonstração, só neste navegador. */
var SB={url:'',key:'',google:false,recovery:false};
var CLOUD=!!(SB.url&&SB.key), sb=null;
var A={ready:false,offline:false,session:null,profile:null,own:{},shopsLoaded:false,accounts:null,view:'welcome',err:'',msg:'',busy:false,justIn:false};
var PUB={}, DBB={}, REV={}, DATA={};
var THEMES=[['#d4af37','Dourado'],['#3b82f6','Azul'],['#14b8a6','Turquesa'],['#22c55e','Verde'],['#ef4444','Vermelho'],['#ec4899','Rosa'],['#8b5cf6','Roxo'],['#f97316','Laranja']];
var MODES={
  dark:{bg:'#0b0b0b',surface:'#151514',sunken:'#1e1e1c',ink:'#f5f5f5',muted:'#a3a19b',line:'#2a2925',glass:'rgba(11,11,11,.82)',
        go:'#6fd3a0','on-go':'#06231a','go-soft':'#15301f',warn:'#e9c46a','warn-soft':'#33290f',bad:'#f08a80','bad-soft':'#3d1c19'},
  light:{bg:'#faf8f4',surface:'#ffffff',sunken:'#f1eee8',ink:'#1b1a17',muted:'#66635b',line:'#dedad1',glass:'rgba(250,248,244,.86)',
        go:'#17764a','on-go':'#ffffff','go-soft':'#dff3e8',warn:'#7a5600','warn-soft':'#faedc8',bad:'#b8322a','bad-soft':'#fbe3e0'}};
var REMINDER='Olá, {cliente}! Lembrete do seu horário na {barbearia}: {servico}, {data} às {hora}. Posso confirmar?';

function fmtPhone(s){
  var d=digits(s); if(d.length>11&&d.indexOf('55')===0) d=d.slice(2);
  if(d.length===11) return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);
  if(d.length===10) return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);
  return s||'';
}
function bare(p){p=digits(p);return p.length>11&&p.indexOf('55')===0?p.slice(2):p}
function maskPhone(v){
  var d=digits(v).slice(0,11);
  if(d.length<=2) return d.length?'('+d:'';
  if(d.length<=6) return '('+d.slice(0,2)+') '+d.slice(2);
  if(d.length<=10) return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);
  return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);
}
function maskCpf(v){var d=digits(v).slice(0,11),o=d.slice(0,3);if(d.length>3)o+='.'+d.slice(3,6);if(d.length>6)o+='.'+d.slice(6,9);if(d.length>9)o+='-'+d.slice(9);return o}
function cpfOk(v){
  var d=digits(v); if(d.length!==11||/^(\d)\1{10}$/.test(d)) return false;
  for(var t=9;t<11;t++){var sum=0;for(var i=0;i<t;i++)sum+=(+d[i])*(t+1-i);if((sum*10)%11%10!==+d[t])return false}
  return true;
}
function ageOf(birth){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(birth||'')) return null;
  var b=parseDate(birth),n=new Date(),a=n.getFullYear()-b.getFullYear();
  if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate())) a--;
  return a>=0&&a<130?a:null;
}

function okHex(c){c=String(c||'').trim().toLowerCase();return /^#[0-9a-f]{6}$/.test(c)?c:''}
function hexRgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rgbHex(a){return '#'+a.map(function(v){return pad2hex(Math.max(0,Math.min(255,Math.round(v))))}).join('')}
function pad2hex(n){var x=n.toString(16);return x.length<2?'0'+x:x}
function lum(h){var a=hexRgb(h).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2]}
function contrast(a,b){var x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function mixHex(a,b,t){var x=hexRgb(a),y=hexRgb(b);return rgbHex([0,1,2].map(function(i){return x[i]+(y[i]-x[i])*t}))}
function okLogo(u){u=String(u||'');return u.length<400000&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+$/.test(u)?u:''}
function normTheme(t){t=t&&typeof t==='object'?t:{};var c=okHex(t.color);return {color:c&&c!=='#d6ab5c'?c:THEMES[0][0],mode:t.mode==='light'?'light':'dark'}}
function themeVars(t){
  t=normTheme(t); var M=MODES[t.mode], v={}, k, c=t.color, txt=c;
  for(k in M) v['--'+k]=M[k];
  for(var i=1;i<=10&&contrast(txt,M.surface)<4.5;i++) txt=mixHex(c,t.mode==='dark'?'#ffffff':'#000000',i/10);
  v['--brand']=c; v['--accent']=c; v['--brand-text']=txt;
  v['--on-brand']=contrast(c,'#0b0b0b')>=contrast(c,'#ffffff')?'#0b0b0b':'#ffffff';
  v['--brand-soft']=mixHex(c,M.bg,t.mode==='dark'?.84:.86);
  return {vars:v,mode:t.mode,bg:M.bg};
}
var themeKey='';
function applyTheme(t){
  var n=normTheme(t), key=n.color+n.mode; if(key===themeKey) return; themeKey=key;
  var tv=themeVars(n), st=document.documentElement.style;
  for(var k in tv.vars) st.setProperty(k,tv.vars[k]);
  st.setProperty('color-scheme',tv.mode);
  var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content',tv.bg);
}

/* Agenda remota: quando a barbearia tem "api", os horários ocupados vêm do Google Agenda dela
   e o agendamento do cliente é gravado lá. Se a agenda não responder, o app volta ao pedido por WhatsApp. */
var REMOTE={};
function apiOf(shop){return okUrl(shop&&shop.api)}
function remoteOk(shop){var r=REMOTE[shop.slug];return !!(apiOf(shop)&&r&&r.state==='ok')}
function loadBusy(shop,force){
  var api=apiOf(shop); if(!api) return;
  var r=REMOTE[shop.slug];
  if(r&&!force&&(r.state==='loading'||Date.now()-r.at<60000)) return;
  REMOTE[shop.slug]={state:'loading',list:r?r.list:[],at:Date.now(),first:!r};
  var from=today(), to=addDays(from,15+shop.leadDays);
  fetch(api+'?action=busy&from='+from+'&to='+to).then(function(x){return x.json()}).then(function(j){
    if(!j||!j.ok||!Array.isArray(j.busy)) throw new Error('resposta inesperada da agenda');
    REMOTE[shop.slug]={state:'ok',list:j.busy,at:Date.now()}; render();
  }).catch(function(e){console.error(e); REMOTE[shop.slug]={state:'fail',list:[],at:Date.now()}; render()});
}
function slotsFor(shop,date,dur){
  var h=shop.hours[parseDate(date).getDay()];
  if(!h||!h.open) return [];
  var s=toMin(h.start),e=toMin(h.end),step=shop.step||30;
  if(!(s<e)||!(dur>0)) return [];
  var br=shop.pause&&shop.pause.on?[toMin(shop.pause.start),toMin(shop.pause.end)]:null;
  var busy=bookingsOf(shop.slug).filter(function(b){return b.date===date&&b.status!=='cancelado'});
  var rem=REMOTE[shop.slug], dbb=DBB[shop.slug], rb=(rem&&rem.list?rem.list:[]).concat(dbb&&dbb.list?dbb.list:[]).filter(function(x){return x.date===date});
  var now=new Date(), minNow=date===today()?now.getHours()*60+now.getMinutes():-1, out=[];
  if(date<today()) return [];
  for(var t=s;t+dur<=e;t+=step){
    if(t<=minNow) continue;
    if(br&&t<br[1]&&t+dur>br[0]) continue;
    if(busy.some(function(b){return t<b.start+b.dur&&t+dur>b.start})) continue;
    if(rb.some(function(x){return t<x.end&&t+dur>x.start})) continue;
    out.push(t);
  }
  return out;
}

var chains={};
function dbWrite(path,op){
  var p=(chains[path]||Promise.resolve()).then(function(){return op(db.doc(path))});
  chains[path]=p.catch(function(){});
  p.catch(function(e){
    console.error(e);
    toast(e&&e.code==='invalid_argument'?'Você não tem permissão para alterar os dados desta página.':'Não foi possível salvar. Tente de novo.');
  });
  return p;
}

  else if(db) dbWrite('clients/'+c.id,function(r){return r.set(c)}); else persistLocal();

function cloudWrite(path,slug,op){

function pageAll(make){
  var out=[], size=1000;
  var step=function(from){
    return make().range(from,from+size-1).then(chk).then(function(r){
      out=out.concat(r.data||[]);
      return (r.data||[]).length===size&&out.length<20000?step(from+size):out;
    });
  };
  return step(0);
}

function loadDbBusy(shop,force){

/* Dados privados de um negócio (agenda e clientes): só para o dono ou para o administrador. */
function loadData(slug,force){
  if(!sb||!canManage(slug)) return;
  var d=DATA[slug];
  if(d&&(d.busy||(!force&&d.state==='ok'))) return;
  DATA[slug]={state:d?d.state:'loading',busy:true,sig:d?d.sig:''};
  var since=addDays(today(),-730);
  Promise.all([
    pageAll(function(){return sb.from('bookings').select('id,data').eq('shop',slug).gte('date',since).order('id')}),
    pageAll(function(){return sb.from('clients').select('id,data').eq('shop',slug).order('id')})
  ]).then(function(res){
    var sig=stable(res), same=DATA[slug]&&DATA[slug].sig===sig&&DATA[slug].state==='ok';
    DATA[slug]={state:'ok',busy:false,sig:sig,at:Date.now()};
    if(same) return;
    bookingsOf(slug).forEach(function(b){delete S.bookings[b.id]}); clientsOf(slug).forEach(function(c){delete S.clients[c.id]});
    res[0].forEach(function(x){var b=clone(x.data); b.id=x.id; b.shop=slug; S.bookings[x.id]=b});
    res[1].forEach(function(x){var c=clone(x.data); c.id=x.id; c.shop=slug; S.clients[x.id]=c});
    render();
  }).catch(function(e){console.error(e); DATA[slug]={state:d&&d.state==='ok'?'ok':'fail',busy:false,sig:d?d.sig:''}; render()});
}

function loadShops(){
  if(!sb||!approved()) return Promise.resolve();
  var q=sb.from('shops').select('slug,owner,data'); if(!isAdmin()) q=q.eq('owner',uid());
  return q.then(chk).then(function(r){
    var rows=r.data||[], have={};
    rows.forEach(function(x){
      have[x.slug]=true; A.own[x.slug]=x.owner;
      var sh=norm(clone(x.data)); sh.slug=x.slug;
      if(!(ui.draft&&ui.draftOf===x.slug&&stable(ui.draft)!==ui.base)) S.shops[x.slug]=sh;
      PUB[x.slug]={state:'ok'};
    });
    Object.keys(A.own).forEach(function(k){ if(!have[k]&&(A.own[k]===uid()||isAdmin())){delete A.own[k]; delete S.shops[k]; delete PUB[k]} });
    A.shopsLoaded=true;
    /* O negócio fixo do administrador nasce no servidor na primeira entrada dele. */
    var miss=isAdmin()?builtinShops().filter(function(b){return !have[b.slug]}):[];
    if(!miss.length) return;
    return Promise.all(miss.map(function(b){
      return sb.from('shops').insert({slug:b.slug,owner:uid(),data:shopData(b)}).then(function(x){
        if(x.error){console.error(x.error);return}
        S.shops[b.slug]=norm(shopData(b)); S.shops[b.slug].slug=b.slug; A.own[b.slug]=uid(); PUB[b.slug]={state:'ok'};
      });
    }));
  }).catch(function(e){console.error(e); A.shopsLoaded=true; A.err='Não foi possível carregar seus dados. Confira a internet e recarregue a página.'});
}

function startCloud(){
  S.mode='cloud';
  if(!(window.supabase&&typeof window.supabase.createClient==='function')){A.ready=true;A.offline=true;return}
  try{
    var q=new URLSearchParams(location.search), oe=q.get('error_description')||q.get('error');
    if(oe){A.err='Não foi possível entrar com essa conta. Tente de novo.';console.error(oe);cleanUrl()}
    sb=window.supabase.createClient(SB.url,SB.key,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
    /* O retorno do login nunca chama o servidor de dentro do aviso: agenda para o próximo ciclo. */
    sb.auth.onAuthStateChange(function(ev,session){setTimeout(function(){onAuth(ev,session)},0)});
  }catch(e){console.error(e);sb=null;A.ready=true;A.offline=true}
  var tick=function(){
    var r=ui.route; if(document.hidden||!sb) return;
    if((r.name==='panel'||r.manual||r.name==='rate')&&canManage(r.slug)) loadData(r.slug,true);
    else if(r.name==='shop'&&S.shops[r.slug]) loadDbBusy(S.shops[r.slug],true);

  setInterval(tick,60000);

}
function authMsg(e){
  var m=String(e&&(e.message||e.error_description)||''), c=String(e&&e.code||'');
  if(/invalid login credentials/i.test(m)||c==='invalid_credentials') return 'E-mail ou senha incorretos.';
  if(/email not confirmed/i.test(m)||c==='email_not_confirmed') return 'Confirme seu e-mail pelo link que enviamos antes de entrar.';
  if(/already registered|already been registered/i.test(m)||c==='user_already_exists') return 'Já existe uma conta com este e-mail. Entre com a sua senha.';
  if(/password/i.test(m)&&/(least|short|weak)/i.test(m)) return 'Use uma senha com pelo menos 8 caracteres.';
  if(/rate limit|too many/i.test(m)||c==='over_request_rate_limit'||c==='over_email_send_rate_limit') return 'Muitas tentativas em pouco tempo. Aguarde um minuto e tente de novo.';
  if(/signups? (are )?(not allowed|disabled)/i.test(m)) return 'O cadastro de novas contas está fechado no momento.';
  if(/provider is not enabled/i.test(m)) return 'Essa forma de entrar ainda não está ativa.';
  if(/failed to fetch|network/i.test(m)) return 'Sem conexão com o servidor. Confira a internet e tente de novo.';
  return 'Não foi possível concluir. Tente de novo.';
}

  return '<article class="card shop"><div class="stack-s"><h3>'+esc(s.name)+(s.plan==='livre'?' <span class="badge free">sem cobrança</span>':'')+'</h3>'+
    '<p class="meta">'+n+(n===1?' serviço':' serviços')+(s.places.home?' · atende a domicílio':'')+(mine?'':' · '+esc(ownerLabel(A.own[s.slug])))+'</p></div>'+
    '<div class="row"><button class="btn primary grow" data-act="open-panel" data-slug="'+esc(s.slug)+'">Abrir painel</button>'+
    '<button class="btn grow" data-act="open-shop" data-slug="'+esc(s.slug)+'">Página do cliente</button></div></article>';
}
function ownerLabel(id){
  var a=(A.accounts||[]).filter(function(x){return x.id===id})[0];
  return a?(a.name||a.email):'outra conta';
}
function vAccount(){
  var p=A.profile||{}, who=p.name||firstName(String(p.email||'').split('@')[0]);
  var h='<section class="stack-s"><p class="small muted">Conectado como '+esc(p.email||'')+'</p><h1>Olá'+(who?', '+esc(firstName(who)):'')+'</h1></section>';
  if(A.err) h+='<p class="err" role="alert">'+esc(A.err)+'</p>';
  if(p.status==='blocked')
    return h+'<div class="card stack"><h2>Acesso suspenso</h2><p class="muted">Esta conta está sem acesso ao painel. Fale com o administrador do Agenday para regularizar.</p></div>'+
      '<button class="btn" data-act="logout">Sair</button>';
  if(p.status!=='approved')
    return h+'<div class="card stack"><h2>Cadastro em análise</h2><p class="muted">Sua conta foi criada. O acesso ao painel é liberado pelo administrador do Agenday; assim que for aprovado, é só tocar em "Verificar de novo".</p>'+
      '<div class="row"><button class="btn primary grow" data-act="acc-refresh">Verificar de novo</button><button class="btn grow" data-act="logout">Sair</button></div></div>';
  var mine=myShops();
  if(!A.shopsLoaded) h+='<p class="empty">Carregando…</p>';
  else if(mine.length) h+='<section class="stack"><h2>'+(mine.length===1?'Meu negócio':'Meus negócios')+'</h2>'+mine.map(function(s){return shopCard(s,true)}).join('')+'</section>';
  if(A.shopsLoaded&&(!mine.length||isAdmin()))
    h+='<section class="stack"><h2>'+(mine.length?'Cadastrar outro negócio':'Cadastre o seu negócio')+'</h2><div class="card stack">'+
      '<label class="field" for="new-name">Nome do negócio<input type="text" id="new-name" data-bind="newName" value="'+esc(ui.newName)+'" placeholder="Ex.: Barbearia do Elias" autocomplete="off"></label>'+
      '<label class="field" for="new-whats">WhatsApp com DDD <span class="hint">usado para receber os avisos de agendamento</span><input type="tel" id="new-whats" data-bind="newWhats" data-mask="phone" value="'+esc(ui.newWhats)+'" placeholder="(11) 91234-5678" autocomplete="off"></label>'+
      (ui.newErr?'<p class="err">'+esc(ui.newErr)+'</p>':'')+
      '<button class="btn primary" data-act="create-shop"'+(A.busy?' disabled':'')+'>Criar perfil</button>'+
      '<p class="small muted">Depois você ajusta serviços, horários, cores e mensagens pelo painel.</p></div></section>';
  if(isAdmin()){
    var acc=A.accounts, L={pending:'Aguardando',approved:'Aprovada',blocked:'Bloqueada'};
    h+='<section class="stack"><h2>Contas</h2>';
    if(!acc) h+='<p class="empty">Carregando contas…</p>';
    else{
      var ord={pending:0,approved:1,blocked:2};
      h+=acc.slice().sort(function(a,b){return ord[a.status]-ord[b.status]}).map(function(a){
        var shops=Object.keys(S.shops).filter(function(k){return A.own[k]===a.id}).map(function(k){return S.shops[k].name});
        var me=a.id===uid(), acts='';
        if(!me){
          if(a.status!=='approved') acts+='<button class="btn sm primary" data-act="acc-status" data-id="'+esc(a.id)+'" data-st="approved">'+(a.status==='blocked'?'Reativar':'Aprovar')+'</button>';
          if(a.status!=='blocked') acts+='<button class="btn sm danger" data-act="acc-status" data-id="'+esc(a.id)+'" data-st="blocked">'+(a.status==='pending'?'Recusar':'Bloquear')+'</button>';
        }
        return '<article class="card acct"><div class="who"><strong>'+esc(a.name||'Sem nome')+(me?' (você)':'')+'</strong><span class="small muted">'+esc(a.email)+'</span>'+
          '<span class="small muted">'+(shops.length?esc(shops.join(', ')):'Ainda sem negócio cadastrado')+'</span></div>'+
          '<span class="pill '+esc(a.status)+'">'+(a.is_admin?'Administrador':L[a.status]||esc(a.status))+'</span>'+(acts?'<div class="bk-actions">'+acts+'</div>':'')+'</article>';
      }).join('')||'<p class="empty">Nenhuma conta ainda.</p>';
    }
    h+='</section>';
    var others=Object.keys(S.shops).filter(function(k){return A.own[k]&&A.own[k]!==uid()}).map(function(k){return S.shops[k]}).sort(function(a,b){return a.name.localeCompare(b.name)});
    if(others.length) h+='<section class="stack"><h2>Outros negócios</h2>'+others.map(function(s){return shopCard(s,false)}).join('')+'</section>';
  }
  return h+'<button class="btn" data-act="logout">Sair</button>';
}
function vCloud(){
  var r=ui.route, wait='<p class="empty">Carregando…</p>';
  if(r.name==='home'){
    if(A.view==='newpass'&&uid()) return vAuth();
    if(!A.ready) return wait;
    return uid()?vAccount():vAuth();
  }
  var shop=S.shops[r.slug], st=PUB[r.slug];
  if(r.name==='shop'&&!r.manual){
    if(!shop){
      if(!st||st.state==='loading'){loadPublic(r.slug);return wait}
      return st.state==='fail'?'<div class="empty"><p>Não foi possível abrir a página agora. Confira a internet.</p><button class="btn" data-act="retry">Tentar de novo</button></div>'
                              :'<div class="empty"><p>Página de agendamento não encontrada. Confira o link com quem enviou.</p></div>';
    }
    return vShop(shop,false);
  }
  if(!A.ready) return wait;
  if(!uid()){ if(A.view==='welcome') A.view='login'; return vAuth() }
  if(!approved()) return vAccount();
  if(!A.shopsLoaded) return wait;
  if(!shop||!canManage(r.slug)) return '<div class="empty"><p>Este painel não pertence à sua conta.</p><button class="btn" data-act="home">Ir para a minha conta</button></div>';
  var d=DATA[r.slug];
  if(!d||d.state==='loading'){loadData(r.slug);return wait}
  if(d.state==='fail') return '<div class="empty"><p>Não foi possível carregar a agenda. Confira a internet.</p><button class="btn" data-act="retry">Tentar de novo</button></div>';
  if(r.name==='rate'){var rb=S.bookings[r.id]; return rb?vRate(shop,rb):'<div class="empty"><p>Agendamento não encontrado.</p><button class="btn" data-act="open-panel" data-slug="'+esc(shop.slug)+'">Voltar ao painel</button></div>'}
  return r.name==='panel'?vPanel(shop):vShop(shop,true);
}
function themeNow(){
  var r=ui.route, s=r.name==='home'?null:S.shops[r.slug];
  if(!s) return null;
  if(CLOUD&&r.name!=='shop'&&!canManage(r.slug)) return null;
  return r.name==='panel'&&ui.draft&&ui.draftOf===s.slug?ui.draft.theme:s.theme;
}
function syncChrome(){
  var r=ui.route, s=r.name==='home'?null:S.shops[r.slug], named=!!(s&&themeNow());
  applyTheme(themeNow());
  var key=named?'n:'+s.name:'logo';
  if($brand.dataset.k!==key){
    $brand.dataset.k=key; $brand.classList.toggle('named',named);
    if(named){$brand.textContent=s.name; $brand.setAttribute('aria-label',s.name)}
    else{$brand.innerHTML='<img src="logo.png" alt="Agenday" width="113" height="26">'; $brand.setAttribute('aria-label','Agenday, página inicial')}
  }
  $acct.hidden=!(CLOUD&&uid()&&r.name!=='home');
  document.body.classList.toggle('bare',!!$app.querySelector('.welcome'));
  document.body.classList.toggle('has-nav',!!$app.querySelector('.nav'));
}
function view(){
  var r=ui.route;
  if(CLOUD) return vCloud();
  if(r.name==='home') return vHome();
  if(S.mode==='loading') return '<p class="empty">Carregando…</p>';
  var shop=S.shops[r.slug];
  if(!shop) return '<div class="empty"><p>Barbearia não encontrada.</p><button class="btn" data-act="home">Ver todas as barbearias</button></div>';
  if(r.name==='rate'){var rb=S.bookings[r.id]; return rb?vRate(shop,rb):'<div class="empty"><p>Agendamento não encontrado.</p><button class="btn" data-act="open-panel" data-slug="'+esc(shop.slug)+'">Voltar ao painel</button></div>'}
  return r.name==='panel'?vPanel(shop):vShop(shop,!!r.manual);
}
function syncSaveBar(){
  var bar=document.getElementById('savebar'); if(!bar) return;
  var shop=S.shops[ui.route.slug];
  bar.hidden=!(shop&&ui.draft&&stable(ui.draft)!==stable(shop));
}
function render(){
  var a=document.activeElement, fid=a&&a.id&&$app.contains(a)?a.id:null, ss=null, se=null;
  if(fid){try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}}
  var days=$app.querySelector('.days'), sl=days?days.scrollLeft:0;
  $app.innerHTML=view();
  syncChrome();
  if(sl){var d2=$app.querySelector('.days'); if(d2) d2.scrollLeft=sl}
  if(fid){var n=document.getElementById(fid); if(n){try{n.focus({preventScroll:true}); if(ss!=null) n.setSelectionRange(ss,se)}catch(e){}}}
  syncSaveBar();
}
var toastT=null;
function toast(m,ms){$toast.textContent=m;$toast.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){$toast.hidden=true},ms||3200)}

function validate(d){
  if(!String(d.name).trim()) return 'Informe o nome do negócio.';
  var w=digits(d.whats); if(w&&(w.length<10||w.length>13)) return 'WhatsApp inválido. Use DDD + número.';
  for(var i=0;i<d.services.length;i++){var s=d.services[i];
    if(!String(s.name).trim()) return 'Há um serviço sem nome.';
    if(!(Number(s.price)>=0)) return 'Informe o preço de "'+s.name+'".';
    if(!(Number(s.min)>=5)) return 'A duração de "'+s.name+'" precisa ser de pelo menos 5 minutos.';
  }
  for(var k=0;k<d.extras.length;k++){var x=d.extras[k];
    if(!String(x.name).trim()) return 'Há um adicional sem nome.';
    if(!(Number(x.price)>=0)||!(Number(x.min)>=0)) return 'Confira o preço e o tempo de "'+x.name+'".';
  }
  for(var j=0;j<7;j++){var h=d.hours[j]; if(h.open&&!(toMin(h.start)<toMin(h.end))) return 'Em '+WDL[j]+', a abertura precisa ser antes do fechamento.'}
  if(d.pause.on&&!(toMin(d.pause.start)<toMin(d.pause.end))) return 'O almoço precisa começar antes de terminar.';
  if(!d.places.shop&&!d.places.home) return 'Marque pelo menos um local de atendimento.';
  if(d.reviews.google&&!okUrl(d.reviews.google)) return 'O link do Google precisa começar com https://.';
  if(d.places.home&&(!(Number(d.homeFee)>=0)||!(Number(d.homeMin)>=0))) return 'Taxa e tempo de deslocamento não podem ser negativos.';
  return '';
}
function confirmBooking(shop,manual){
  var svc=shop.services.filter(function(s){return s.id===ui.svc})[0];
  var name=ui.cname.trim(), ph=digits(ui.cphone), addr=ui.caddr.trim();
  var ex=pickedExtras(shop);
  var home=placeOf(shop)==='home', dur=svc?Number(svc.min)+sumOf(ex,'min')+(home?shop.homeMin:0):0, fee=home?shop.homeFee:0;
  if(!svc) ui.err='Escolha um serviço.';
  else if(ui.slot==null) ui.err='Escolha um horário.';
  else if(!manual&&shop.leadDays>0&&ui.date<addDays(today(),shop.leadDays)){ui.err='Escolha um dia com pelo menos '+shop.leadDays+(shop.leadDays===1?' dia':' dias')+' de antecedência.';ui.slot=null}
  else if(name.length<2) ui.err=manual?'Informe o nome do cliente.':'Informe seu nome.';
  else if((ph||!manual)&&(ph.length<10||ph.length>13)) ui.err='Informe um WhatsApp com DDD, por exemplo (11) 91234-5678.';
  else if(home&&addr.length<8) ui.err='Informe o endereço completo do atendimento.';
  else if(slotsFor(shop,ui.date,dur).indexOf(ui.slot)<0){ui.err='Esse horário acabou de ser ocupado. Escolha outro.';ui.slot=null}
  else{
    var date=ui.date, slot=ui.slot, route=ui.route;
    var finish=function(synced){
      var cid=(route.clientId&&S.clients[route.clientId])?route.clientId:upsertClient(shop,name,ph,home?addr:'');
      var b={id:rid('b'),shop:shop.slug,date:date,start:slot,dur:dur,serviceId:svc.id,serviceName:[svc.name].concat(ex.map(function(e){return e.name})).join(' + '),extras:ex.map(function(e){return {id:e.id,name:e.name,price:Number(e.price)||0}}),price:Number(svc.price)+sumOf(ex,'price')+fee,fee:fee,place:home?'home':'shop',address:home?addr:'',client:name,clientId:cid,phone:ph,status:'agendado',synced:!!synced,createdAt:new Date().toISOString()};
      if(manual){ui.cname='';ui.cphone='';ui.caddr=''}
      else saveMe({name:name,phone:ph,addr:home?addr:((loadMe()||{}).addr||'')});
      ui.err=''; ui.done=b.id; ui.slot=null; ui.extras={}; ui.pbirth=''; ui.pcpf=''; ui.paddr=home?addr:''; ui.pfSaved=false; ui.pfErr='';
      putBooking(b); try{window.scrollTo(0,0)}catch(e){}
    };
    if(!manual&&onCloud(shop.slug)){
      if(ui.sending) return;
      ui.sending=true; ui.err=''; render();
      var req={shop:shop.slug,date:date,start:slot,serviceId:svc.id,extras:ex.map(function(e){return e.id}),place:home?'home':'shop',name:name,phone:ph,address:home?addr:''};
      sb.rpc('public_book',{p:req}).then(chk).then(function(x){
        var j=x.data||{};
        ui.sending=false;
        if(!j.ok){
          if(ui.route!==route){render();return}
          loadDbBusy(shop,true);
          if(j.error==='busy'){ui.err='Esse horário acabou de ser ocupado. Escolha outro.';ui.slot=null;toStep(['st-slot']);return}
          ui.err=j.message||'Não foi possível reservar esse horário. Escolha outro ou fale pelo WhatsApp.';
          if(j.error==='past'||j.error==='closed') ui.slot=null;
          toStep([ui.slot==null?'st-slot':'st-data']); return;
        }
        var b={id:j.id,shop:shop.slug,date:date,start:slot,dur:Number(j.dur)||dur,serviceId:svc.id,serviceName:j.serviceName||svc.name,extras:j.extras||[],price:Number(j.price)||0,fee:Number(j.fee)||0,
               place:home?'home':'shop',address:home?addr:'',client:name,clientId:j.clientId,phone:ph,status:'agendado',synced:true,origin:'cliente',createdAt:new Date().toISOString()};
        S.bookings[b.id]=b;
        if(!S.clients[j.clientId]) S.clients[j.clientId]={id:j.clientId,shop:shop.slug,name:name,phone:ph,birth:'',cpf:'',address:home?addr:'',notes:'',stub:true};
        saveMe({name:name,phone:ph,addr:home?addr:((loadMe()||{}).addr||'')});
        /* Negócio com Google Agenda ligado: o evento também entra lá. Se a agenda falhar, a reserva continua valendo. */
        if(apiOf(shop)) fetch(apiOf(shop),{method:'POST',body:JSON.stringify({action:'book',shop:shop.slug,date:date,start:slot,dur:b.dur,service:b.serviceName,price:b.price,name:name,phone:ph,address:b.address})})
          .then(function(y){return y.json()}).then(function(k){ if(!k||!k.ok) console.error('agenda',k); loadBusy(shop,true) }).catch(function(e){console.error(e)});
        loadDbBusy(shop,true); if(canManage(shop.slug)) loadData(shop.slug,true);
        if(ui.route!==route){render();return}
        ui.err=''; ui.done=b.id; ui.slot=null; ui.extras={}; ui.pbirth=''; ui.pcpf=''; ui.paddr=home?addr:''; ui.pfSaved=false; ui.pfErr='';
        render(); try{window.scrollTo(0,0)}catch(e){}
      }).catch(function(e){
        console.error(e); ui.sending=false;
        ui.err='Não foi possível reservar agora. Confira a internet e tente de novo, ou fale pelo WhatsApp.';
        if(ui.route===route) toStep(['st-data']); else render();
      });
      return;
    }
    if(manual||!remoteOk(shop)){finish(false);return}
    if(ui.sending) return;
    ui.sending=true; ui.err=''; render();
    var payload={action:'book',shop:shop.slug,date:date,start:slot,dur:dur,service:[svc.name].concat(ex.map(function(e){return e.name})).join(' + '),price:Number(svc.price)+sumOf(ex,'price')+fee,name:name,phone:ph,address:home?addr:''};
    fetch(apiOf(shop),{method:'POST',body:JSON.stringify(payload)}).then(function(x){return x.json()}).then(function(j){
      ui.sending=false;
      if(ui.route!==route){render();return}
      if(j&&j.ok){finish(true);loadBusy(shop,true);return}
      if(j&&j.error==='busy'){ui.err='Esse horário acabou de ser ocupado. Escolha outro.';ui.slot=null;loadBusy(shop,true);toStep(['st-slot']);return}
      if(j&&j.error){ui.err=j.message||'Não foi possível reservar esse horário. Escolha outro ou fale pelo WhatsApp.';toStep(['st-data']);return}
      finish(false);
    }).catch(function(e){console.error(e);ui.sending=false; if(ui.route===route) finish(false); else render()});
    return;
  }
  toStep([ui.slot==null?'st-slot':'st-data']);
}
var ACT={
  install:function(){
    if(deferredInstall){var d=deferredInstall; deferredInstall=null; $install.hidden=true; try{d.prompt()}catch(e){} return}
    toast('No iPhone: toque em Compartilhar e depois em "Adicionar à Tela de Início".',9000);
  },
  home:function(){A.err='';go({name:'home'})},
  brand:function(){
    var r=ui.route;
    if(CLOUD&&r.name!=='home'&&!uid()){try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){} return}
    if(CLOUD&&(r.name==='shop'||r.name==='rate')&&canManage(r.slug)){go({name:'panel',slug:r.slug});return}
    if(CLOUD&&r.name==='panel'){try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){} return}
    go({name:'home'});
  },
  retry:function(){var r=ui.route; delete PUB[r.slug]; if(DATA[r.slug]&&DATA[r.slug].state==='fail') delete DATA[r.slug]; render()},
  'auth-view':function(t){A.view=t.dataset.v;A.err='';A.msg='';ui.aPass='';render();try{window.scrollTo(0,0)}catch(e){}},
  'auth-google':function(){
    if(!sb||A.busy) return;
    A.busy=true;A.err='';A.msg='';render();
    try{sessionStorage.setItem('agenday.ret',location.hash||'')}catch(e){}
    sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:baseUrl()}}).then(function(r){
      if(r.error){A.busy=false;A.err=authMsg(r.error);render()}
    }).catch(function(e){A.busy=false;A.err=authMsg(e);render()});
  },
  'auth-submit':function(){
    if(!sb||A.busy) return;
    var v=A.view, email=ui.aEmail.trim().toLowerCase(), pass=ui.aPass, name=ui.aName.trim().replace(/\s+/g,' ');
    A.msg='';
    if(v==='signup'&&name.length<2) A.err='Informe seu nome.';
    else if(v!=='newpass'&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) A.err='Informe um e-mail válido.';
    else if(v==='login'&&!pass) A.err='Informe sua senha.';
    else if((v==='signup'||v==='newpass')&&pass.length<8) A.err='Use uma senha com pelo menos 8 caracteres.';
    else{
      A.err=''; A.busy=true; render();
      var done=function(){A.busy=false;render()}, fail=function(e){console.error(e);A.busy=false;A.err=authMsg(e);render()};
      if(v==='login') sb.auth.signInWithPassword({email:email,password:pass}).then(function(r){ if(r.error) fail(r.error) }).catch(fail);
      else if(v==='signup') sb.auth.signUp({email:email,password:pass,options:{data:{full_name:name},emailRedirectTo:baseUrl()}}).then(function(r){
        if(r.error){fail(r.error);return}
        var u=r.data&&r.data.user;
        if(r.data&&r.data.session) return;
        ui.aPass='';
        if(u&&Array.isArray(u.identities)&&!u.identities.length){A.view='login';A.err='Já existe uma conta com este e-mail. Entre com a sua senha.'}
        else{A.view='login';A.msg='Conta criada. Enviamos um link de confirmação para '+email+'. Abra o e-mail e toque no link para entrar.'}
        done();
      }).catch(fail);
      else if(v==='reset') sb.auth.resetPasswordForEmail(email,{redirectTo:baseUrl()}).then(function(r){
        if(r.error){fail(r.error);return}
        A.msg='Se existir uma conta com esse e-mail, o link para criar a nova senha já foi enviado.'; done();
      }).catch(fail);
      else sb.auth.updateUser({password:pass}).then(function(r){
        if(r.error){fail(r.error);return}
        ui.aPass=''; A.view='login'; A.busy=false; toast('Senha alterada.'); render();
      }).catch(fail);
      return;
    }
    render();
  },
  logout:function(){
    if(!sb) return;
    ui.draft=null; A.view='welcome'; A.err=''; A.msg='';
    sb.auth.signOut().then(function(){go({name:'home'})}).catch(function(e){console.error(e);toast('Não foi possível sair. Tente de novo.')});
  },
  'acc-refresh':function(){A.err='';A.profile=null;A.ready=false;render();loadProfile()},
  'acc-status':function(t){
    if(!sb||!isAdmin()) return;
    var id=t.dataset.id, st=t.dataset.st;
    t.disabled=true;
    sb.rpc('admin_set_status',{p_user:id,p_status:st}).then(chk).then(function(){
      toast({approved:'Conta aprovada.',blocked:'Acesso bloqueado.'}[st]||'Conta atualizada.'); loadAccounts();
    }).catch(function(e){console.error(e);toast('Não foi possível alterar a conta.');loadAccounts()});
  },
  'rm-logo':function(){ if(!ui.draft) return; ui.draft.logo=''; render()},
  'theme-color':function(t){ if(!ui.draft) return; ui.draft.theme.color=t.dataset.c; render()},
  'theme-mode':function(t){ if(!ui.draft) return; ui.draft.theme.mode=t.dataset.m==='light'?'light':'dark'; render()},
  seed:function(){seedExample();render()},
  'open-shop':function(t){go({name:'shop',slug:t.dataset.slug})},
  'open-panel':function(t){go({name:'panel',slug:t.dataset.slug})},
  manual:function(t){var d=ui.pdate; go({name:'shop',slug:t.dataset.slug,manual:true}); if(d>=today()&&d<=addDays(today(),13)){ui.date=d;render()}},
  'create-shop':function(){
    var name=ui.newName.trim(), w=digits(ui.newWhats);
    if(S.mode==='loading'){ui.newErr='Aguarde o carregamento terminar.';return render()}
    if(name.length<2){ui.newErr=CLOUD?'Informe o nome do negócio.':'Informe o nome da barbearia.';return render()}
    if(w&&(w.length<10||w.length>13)){ui.newErr='WhatsApp inválido. Use DDD + número.';return render()}
    var base=slugify(name)||'barbearia', slug=base, i=2;
    if(base.length<2) base=slug='negocio';
    if(CLOUD){
      if(!sb||!approved()||A.busy) return;
      A.busy=true; ui.newErr=''; render();
      var attempt=function(sl,n){
        var sh=newShop(name,w,sl);
        return sb.from('shops').insert({slug:sl,owner:uid(),data:shopData(sh)}).then(function(r){
          if(r.error){
            if(r.error.code==='23505'&&n<30) return attempt(base.slice(0,36)+'-'+(n+1),n+1);
            throw r.error;
          }
          A.busy=false; S.shops[sl]=sh; A.own[sl]=uid(); PUB[sl]={state:'ok'}; DATA[sl]={state:'ok',busy:false,sig:''};
          ui.newName='';ui.newWhats='';ui.newErr=''; ui.draft=null;
          go({name:'panel',slug:sl}); ui.tab='servicos'; render();
          toast('Perfil criado. Ajuste seus serviços e horários.');
        });
      };
      attempt(base,1).catch(function(e){console.error(e);A.busy=false;ui.newErr='Não foi possível criar o perfil. Tente de novo.';render()});
      return;
    }
    while(S.shops[slug]) slug=base+'-'+(i++);
    var shop=newShop(name,w,slug);
    ui.newName='';ui.newWhats='';ui.newErr='';
    putShop(shop); ui.draft=null; go({name:'panel',slug:slug}); ui.tab='servicos'; render();
    toast('Perfil criado. Ajuste seus serviços e horários.');
  },
  'pick-svc':function(t){ui.svc=t.dataset.id;ui.err='';toStep(['st-extra','st-place','st-day'])},
  'pick-extra':function(t){var id=t.dataset.id; if(ui.extras[id]) delete ui.extras[id]; else ui.extras[id]=true; ui.err=''; render()},
  'pick-place':function(t){ui.place=t.dataset.p;ui.slot=null;ui.err='';toStep(['st-day'])},
  'pick-day':function(t){ui.date=t.dataset.d;ui.slot=null;ui.err='';toStep(['st-slot'])},
  'pick-slot':function(t){ui.slot=+t.dataset.t;ui.err='';toStep(['st-data'])},
  forget:function(){clearMe();ui.cname='';ui.cphone='';ui.caddr='';render()},
  confirm:function(t){var s=S.shops[ui.route.slug]; if(s) confirmBooking(s,!!t.dataset.manual)},
  again:function(){ui.done=null;render();try{window.scrollTo(0,0)}catch(e){}},
  copy:function(t){
    var el=document.getElementById(t.dataset.from), txt=el?el.textContent:'';
    var sel=function(){try{var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){} toast('Texto selecionado. Copie com o teclado ou o menu.')};
    try{navigator.clipboard.writeText(txt).then(function(){toast('Copiado.')},sel)}catch(e){sel()}
  },
  tab:function(t){ui.tab=t.dataset.tab;ui.perr='';ui.confirmDel=false;ui.cid=null;ui.cdraft=null;render();try{window.scrollTo(0,0)}catch(e){}},
  pmonth:function(t){var ym=ui.pmonth||today().slice(0,7), d=new Date(+ym.slice(0,4),+ym.slice(5,7)-1+(+t.dataset.n),1); ui.pmonth=d.getFullYear()+'-'+pad(d.getMonth()+1); render()},
  'pick-pday':function(t){ui.pdate=t.dataset.d;render()},
  ptoday:function(){ui.pdate=today();ui.pmonth=ui.pdate.slice(0,7);render()},
  clients:function(){ui.cid=null;ui.cdraft=null;ui.cerr='';ui.cdel=false;render()},
  'open-client':function(t){
    var c=S.clients[t.dataset.id]; if(!c) return;
    ui.tab='clientes'; ui.cid=c.id; ui.cerr=''; ui.cdel=false;
    ui.cdraft={name:c.name||'',phone:c.phone?maskPhone(bare(c.phone)):'',birth:c.birth||'',cpf:c.cpf?maskCpf(c.cpf):'',address:c.address||'',notes:c.notes||''};
    render(); try{window.scrollTo(0,0)}catch(e){}
  },
  'new-client':function(){ui.cid='new';ui.cerr='';ui.cdel=false;ui.cdraft={name:'',phone:'',birth:'',cpf:'',address:'',notes:''};render();try{window.scrollTo(0,0)}catch(e){}},
  'save-client':function(){
    var d=ui.cdraft, name=d.name.trim(), ph=digits(d.phone), cpf=digits(d.cpf);
    if(name.length<2) ui.cerr='Informe o nome do cliente.';
    else if(ph&&(ph.length<10||ph.length>13)) ui.cerr='WhatsApp inválido. Use DDD + número.';
    else if(d.birth&&ageOf(d.birth)==null) ui.cerr='Data de nascimento inválida.';
    else if(cpf&&!cpfOk(cpf)) ui.cerr='CPF inválido. Confira os números.';
    else{
      var c=ui.cid==='new'?{id:rid('c'),shop:ui.route.slug,createdAt:new Date().toISOString()}:clone(S.clients[ui.cid]);
      c.name=name; c.phone=ph; c.birth=d.birth||''; c.cpf=cpf; c.address=d.address.trim(); c.notes=d.notes.trim();
      ui.cid=c.id; ui.cerr=''; putClient(c); toast('Cliente salvo.'); return;
    }
    render();
  },
  'book-client':function(){
    var c=S.clients[ui.cid]; if(!c) return;
    ui.cname=c.name; ui.cphone=c.phone?maskPhone(bare(c.phone)):''; ui.caddr=c.address||'';
    go({name:'shop',slug:ui.route.slug,manual:true,keep:true,clientId:c.id});
  },
  'cdel-ask':function(){ui.cdel=true;render()},
  'cdel-no':function(){ui.cdel=false;render()},
  'cdel-yes':function(){delClient(ui.cid);ui.cid=null;ui.cdraft=null;ui.cdel=false;render();toast('Cliente excluído.')},
  'open-rate':function(t){go({name:'rate',slug:ui.route.slug,id:t.dataset.id})},
  star:function(t){ui.rstar=+t.dataset.n;ui.err='';render()},
  'send-rate':function(){
    var b=S.bookings[ui.route.id]; if(!b) return;
    if(!ui.rstar){ui.err='Toque em uma estrela para dar a nota.';return render()}
    var n=clone(b); n.rating=ui.rstar; n.review=ui.rtext.trim().slice(0,300); n.ratedAt=new Date().toISOString();
    ui.err=''; putBooking(n); toast('Avaliação registrada.'); try{window.scrollTo(0,0)}catch(e){}
  },
  'save-profile':function(){
    var b=S.bookings[ui.done], c=b&&S.clients[b.clientId]; if(!c) return;
    var cpf=digits(ui.pcpf), addr=ui.paddr.trim();
    if(ui.pbirth&&ageOf(ui.pbirth)==null) ui.pfErr='Data de nascimento inválida.';
    else if(cpf&&!cpfOk(cpf)) ui.pfErr='CPF inválido. Confira os números.';
    else if(!ui.pbirth&&!cpf&&!addr) ui.pfErr='Preencha pelo menos um campo, ou pule esta etapa.';
    else if(CLOUD&&onCloud(b.shop)&&b.origin==='cliente'){
      ui.pfErr='';
      sb.rpc('public_complete',{p_booking:b.id,p:{birth:ui.pbirth||'',cpf:cpf,address:addr}}).then(chk).then(function(x){
        if(!x.data||!x.data.ok) throw new Error('cadastro não salvo');
        var n2=clone(c); if(ui.pbirth) n2.birth=ui.pbirth; if(cpf) n2.cpf=cpf; if(addr) n2.address=addr;
        S.clients[n2.id]=n2; ui.pfSaved=true; toast('Cadastro salvo.'); render();
      }).catch(function(e){console.error(e);ui.pfErr='Não foi possível salvar agora. Tente de novo.';render()});
      return;
    }
    else{
      var n=clone(c); if(ui.pbirth) n.birth=ui.pbirth; if(cpf) n.cpf=cpf; if(addr) n.address=addr;
      ui.pfErr=''; ui.pfSaved=true; putClient(n); toast('Cadastro salvo.'); return;
    }
    render();
  },
  status:function(t){
    var b=S.bookings[t.dataset.id]; if(!b) return;
    var n=clone(b); n.status=t.dataset.st; putBooking(n);
    toast({concluido:'Atendimento concluído.',cancelado:'Agendamento cancelado.',agendado:'Agendamento reativado.'}[n.status]);
  },
  'add-svc':function(){ui.draft.services.push({id:rid('s'),name:'',price:0,min:30});render();var i=ui.draft.services.length-1,el=document.getElementById('sv-n-'+i);if(el)el.focus()},
  'rm-svc':function(t){ui.draft.services.splice(+t.dataset.i,1);render()},
  'add-ext':function(){ui.draft.extras.push({id:rid('x'),name:'',price:0,min:0});render();var i=ui.draft.extras.length-1,el=document.getElementById('ex-n-'+i);if(el)el.focus()},
  'rm-ext':function(t){ui.draft.extras.splice(+t.dataset.i,1);render()},
  plan:function(){ui.draft.plan=ui.draft.plan==='livre'?'mensal':'livre';render()},
  discard:function(){ui.draft=null;ui.perr='';render()},
  save:function(){
    var d=clone(ui.draft); d.whats=digits(d.whats); d.name=String(d.name).trim();
    d.services.forEach(function(s){s.price=Number(s.price);s.min=Number(s.min);s.name=String(s.name).trim()});
    d.extras.forEach(function(x){x.price=Number(x.price);x.min=Number(x.min)||0;x.name=String(x.name).trim()});
    d.homeFee=Number(d.homeFee)||0; d.homeMin=Number(d.homeMin)||0;
    var e=validate(d); if(e){ui.perr=e;render();toast(e);return}
    d.theme=normTheme(d.theme);
    if(d.builtin) d.localEdit=true;
    ui.perr=''; ui.draft=null; putShop(d); toast('Alterações salvas.');
  },
  'del-ask':function(){ui.confirmDel=true;render()},
  'del-no':function(){ui.confirmDel=false;render()},
  'del-yes':function(){var s=ui.route.slug;delShop(s);ui.draft=null;go({name:'home'});toast('Negócio excluído.')}
};
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-act]'):null;
  if(!t||t.disabled) return;
  var f=ACT[t.dataset.act]; if(f){e.preventDefault();f(t)}
});
document.addEventListener('change',function(e){
  var t=e.target; if(!t||!t.dataset||!t.dataset.logo||!ui.draft) return;
  var f=t.files&&t.files[0]; if(!f) return;
  if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>12*1024*1024){ui.perr='Use uma imagem PNG, JPG ou WebP de até 12 MB.';render();return}
  var url=URL.createObjectURL(f), img=new Image();
  img.onload=function(){
    try{
      var max=360, k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)), w=Math.max(1,Math.round(img.naturalWidth*k)), h=Math.max(1,Math.round(img.naturalHeight*k));
      var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      var out=c.toDataURL('image/webp',.9); if(out.indexOf('data:image/webp')!==0) out=c.toDataURL('image/png');
      if(!okLogo(out)) throw new Error('logo grande demais');
      if(ui.draft){ui.draft.logo=out; ui.perr=''}
    }catch(x){console.error(x);ui.perr='Não foi possível usar essa imagem. Tente outra.'}
    URL.revokeObjectURL(url); render();
  };
  img.onerror=function(){URL.revokeObjectURL(url);ui.perr='Não foi possível ler essa imagem. Tente outra.';render()};
  img.src=url;
});
document.addEventListener('submit',function(e){
  var f=e.target; if(!f||!f.dataset||f.dataset.form!=='auth') return;
  e.preventDefault(); ACT['auth-submit']();
});
document.addEventListener('input',function(e){
  var t=e.target, ds=t.dataset; if(!ds) return;
  if(ds.mask){var end=true; try{end=t.selectionStart===t.value.length}catch(x){} if(end) t.value=ds.mask==='cpf'?maskCpf(t.value):maskPhone(t.value)}
  if(ds.bind){
    ui[ds.bind]=t.value;
    if(ds.bind==='cq') render();
    else if(/^a(Email|Pass|Name)$/.test(ds.bind)){ if(A.err){A.err='';var ae=$app.querySelector('.auth .err'); if(ae) ae.remove()} }
    else if(ui.err&&/^c(name|phone|addr)$/.test(ds.bind)){ui.err='';var er=$app.querySelector('#st-data .err'); if(er) er.remove()}
    return;
  }
  if(ds.c){
    if(!ui.cdraft) return;
    ui.cdraft[ds.c]=t.value;
    if(ds.c==='address'){var a=document.getElementById('cl-map'),v=t.value.trim(); if(a){a.hidden=!v;a.href=mapLink(v)}}
    if(ds.c==='birth'){var g=document.getElementById('cl-age'),ag=ageOf(t.value); if(g) g.textContent=ag!=null?ag+' anos':'a idade é calculada sozinha'}
    return;
  }
  if(!ui.draft) return;
  if(ds.theme){ var hc=okHex(t.value); if(hc){ui.draft.theme.color=hc; syncChrome(); syncSaveBar(); $app.querySelectorAll('.swatch').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.c===hc))})} return }
  if(ds.rev){ if(t.type==='checkbox'){ui.draft.reviews.on=t.checked;render();return} ui.draft.reviews.google=t.value.trim(); syncSaveBar(); return }
  if(ds.place){ui.draft.places[ds.place]=t.checked;render();return}
  if(ds.f){ui.draft[ds.f]=(ds.f==='step'||ds.f==='leadDays'||t.type==='number')?Number(t.value):t.value}
  else if(ds.ext!=null){var x=ui.draft.extras[+ds.ext]; if(x) x[ds.k]=t.type==='number'?(t.value===''?'':Number(t.value)):t.value}
  else if(ds.svc!=null){var s=ui.draft.services[+ds.svc]; if(s) s[ds.k]=t.type==='number'?(t.value===''?'':Number(t.value)):t.value}
  else if(ds.day!=null){var h=ui.draft.hours[+ds.day]; if(t.type==='checkbox'){h.open=t.checked;render();return} h[ds.k]=t.value}
  else if(ds.pause){ if(t.type==='checkbox'){ui.draft.pause.on=t.checked;render();return} ui.draft.pause[ds.pause]=t.value }
  syncSaveBar();
});
/* ---------- instalar como app ---------- */
var $install=document.getElementById('install-btn'), deferredInstall=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;$install.hidden=false});
window.addEventListener('appinstalled',function(){deferredInstall=null;$install.hidden=true});
try{
  var web=(location.protocol==='https:'||location.hostname==='localhost')&&!(window.claude&&window.claude.use);
  if(web&&/iphone|ipad|ipod/i.test(navigator.userAgent)&&!isStandalone()) $install.hidden=false;
  if(web&&'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(e){console.error(e)});
}catch(e){}
window.addEventListener('hashchange',function(){
  var r=routeOf(location.hash);
  if(CLOUD){ if(r){ if(r.slug!==ui.route.slug||r.name!==ui.route.name) go(r) } else if(!location.hash&&ui.route.name!=='home') go({name:'home'}); return }
  if(r&&S.shops[r.slug]) go(r);
});
init();
})();
